{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">User Detail</h3>
        <a href="{% url 'admin_panel' %}?tab=users" class="btn btn-outline-secondary font-weight-bold">
            <i class="fas fa-arrow-left mr-1"></i> Back to Users
        </a>
    </div>

    <div class="card p-3">

        <p><b>Username:</b> {{ user_obj.username }}</p>
        <p><b>Email:</b> {{ user_obj.email }}</p>
        <p><b>Phone:</b> {{ user_obj.phone_number }}</p>
        <p><b>Country:</b> {{ user_obj.country }}</p>
        <p><b>Location:</b> {{ user_obj.location }}</p>

        <a href="{% url 'edit_user' user_obj.id %}" class="btn btn-warning">
            Edit User
        </a>

    </div>

</div>

{% endblock %}
