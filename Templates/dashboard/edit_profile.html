{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Edit Profile</h3>
            <a href="{% url 'profile' %}" class="btn btn-outline-secondary font-weight-bold">
                <i class="fas fa-arrow-left mr-1"></i> Back to Profile
            </a>
        </div>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input type="text"
                       name="username"
                       class="form-control"
                       value="{{ user.username }}">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       value="{{ user.email }}">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text"
                       name="phone_number"
                       class="form-control"
                       value="{{ user.phone_number }}">
            </div>

            <div class="form-group">
                <label>Location</label>
                <input type="text"
                       name="location"
                       class="form-control"
                       value="{{ user.location }}">
            </div>

            <div class="form-group">
                <label>Country</label>
                <input type="text"
                       name="country"
                       class="form-control"
                       value="{{ user.country }}">
            </div>

            <div class="form-group">
                <label>Profile Image</label>
                <input type="file"
                       name="profile_image"
                       class="form-control">
            </div>

            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>

        </form>

    </div>

</div>

{% endblock %}
