{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Add New Product</h3>
        <a href="{% url 'admin_panel' %}?tab=products" class="btn btn-outline-secondary font-weight-bold">
            <i class="fas fa-arrow-left mr-1"></i> Back to Products
        </a>
    </div>

    <div class="card shadow p-4">

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Product Name -->
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter product name" required>
            </div>

            <!-- Price -->
            <div class="form-group">
                <label>Price (৳)</label>
                <input type="number" step="0.01" name="price" class="form-control" placeholder="Enter price" required>
            </div>

            <!-- Unit -->
            <div class="form-group">
                <label>Unit</label>
                <select name="unit" class="form-control" required>

                    {% for value, label in unit_choices %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}

                </select>
            </div>

            <!-- Status (Active / Inactive) -->
            <div class="form-group mb-3">
                <label class="font-weight-bold d-block">Display Status in Shop</label>
                <div class="custom-control custom-switch">
                    <input type="checkbox" class="custom-control-input" id="isActiveSwitch" name="is_active" checked>
                    <label class="custom-control-label font-weight-bold" for="isActiveSwitch">
                        Active (Visible in Shop immediately)
                    </label>
                </div>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="4" placeholder="Enter product details"></textarea>
            </div>

            <!-- Image -->
            <div class="form-group">
                <label>Product Image</label>
                <input type="file" name="image" class="form-control-file">
            </div>

            <!-- Buttons -->
            <div class="text-center mt-4">

                <button type="submit" class="btn btn-success px-4">
                    Save Product
                </button>

                <a href="{% url 'admin_panel' %}" class="btn btn-secondary px-4 ml-2">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
