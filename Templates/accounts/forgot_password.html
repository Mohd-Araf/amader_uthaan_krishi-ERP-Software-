{% extends 'base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2>Forgot Password</h2>
        <p>Enter your registered Gmail to receive verification code:</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-info btn-block">Send Code</button>
        </form>
    </div>
</div>
{% endblock %}
