{% extends 'base.html' %}

{% block title %}Verify Code{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2>Verify Code</h2>
        <p>OTP will expire in <span id="timer">{{ remaining_seconds }}</span> seconds</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary btn-block">Verify</button>
        </form>
    </div>
</div>

<script>
    // Countdown timer (start from remaining_seconds from backend)
    let timeLeft = {{ remaining_seconds }};
    const timerDisplay = document.getElementById('timer');

    if(timeLeft <= 0){
        timerDisplay.textContent = 0;
        alert('OTP expired! Please request a new code.');
        window.location.href = "{% url 'forgot_password' %}";
    }else{
        const countdown = setInterval(() => {
            timeLeft--;
            timerDisplay.textContent = timeLeft;

            if(timeLeft <= 0){
                clearInterval(countdown);
                timerDisplay.textContent = 0;
                alert('OTP expired! Please request a new code.');
                window.location.href = "{% url 'forgot_password' %}";
            }
        }, 1000);
    }
</script>
{% endblock %}
