{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<!-- Google Fonts (Modern Font) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<div class="login-wrapper">
    <!-- Background Ambient Glows -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="login-box">
        <!-- Header -->
        <div class="login-header">
            <div class="icon-badge">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <h2>User Login</h2>
            <p class="subtitle">Welcome back! Please enter your details.</p>
        </div>

        <form method="post" class="login-form">
            {% csrf_token %}

            <!-- Username / Email Field -->
            <div class="form-group">
                <label for="{{ form.username.id_for_label|default:'id_username' }}">Username / Email</label>
                <div class="input-container">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                        </svg>
                    </span>
                    {{ form.username }}
                </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="{{ form.password.id_for_label|default:'id_password' }}">Password</label>
                <div class="input-container">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    {{ form.password }}
                </div>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="remember-row">
                <label class="remember-me">
                    <input type="checkbox" name="remember_me">
                    <span>Remember me</span>
                </label>

                <a href="{% url 'forgot_password' %}" class="forgot-link">
                    Forgot Password?
                </a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">
                <span>LOGIN</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"></path>
                    <path d="m12 5 7 7-7 7"></path>
                </svg>
            </button>
        </form>

        <!-- Signup Footer -->
        <p class="signup">
            Don't have an account?
            <a href="{% url 'signup' %}">Sign Up</a>
        </p>
    </div>
</div>

<style>
/* Base Wrapper */
.login-wrapper {
    min-height: 88vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 30px 15px;
    background: linear-gradient(135deg, #e8f5e9 0%, #d8f3dc 50%, #f4fbf7 100%);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    box-sizing: border-box;
}

/* Background Soft Glows */
.bg-glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.55;
    pointer-events: none;
}
.glow-1 {
    width: 320px;
    height: 320px;
    background: #74c69d;
    top: 5%;
    left: 15%;
}
.glow-2 {
    width: 280px;
    height: 280px;
    background: #95d5b2;
    bottom: 5%;
    right: 15%;
}

/* Login Card */
.login-box {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    padding: 40px 34px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.95);
    border-radius: 24px;
    box-shadow: 
        0 20px 40px rgba(45, 106, 79, 0.08),
        0 1px 3px rgba(0, 0, 0, 0.02);
    box-sizing: border-box;
}

/* Header */
.login-header {
    text-align: center;
    margin-bottom: 28px;
}

.icon-badge {
    width: 48px;
    height: 48px;
    margin: 0 auto 14px;
    background: #d8f3dc;
    color: #2d6a4f;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(45, 106, 79, 0.12);
}

.login-header h2 {
    font-size: 26px;
    font-weight: 700;
    color: #1b4332;
    margin: 0 0 6px;
    letter-spacing: -0.5px;
}

.login-header .subtitle {
    font-size: 13px;
    color: #52796f;
    margin: 0;
}

/* Form Groups */
.form-group {
    margin-bottom: 18px;
    text-align: left;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #2d6a4f;
    margin-bottom: 6px;
}

/* Input Containers */
.input-container {
    position: relative;
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.9);
    border: 1.5px solid #c7e6d2;
    border-radius: 12px;
    transition: all 0.25s ease;
}

.input-container:focus-within {
    border-color: #2d6a4f;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(45, 106, 79, 0.12);
}

.input-icon {
    position: absolute;
    left: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #52b788;
    pointer-events: none;
    transition: color 0.2s ease;
}

.input-container:focus-within .input-icon {
    color: #2d6a4f;
}

/* Django Form Input Styling */
.input-container input {
    width: 100%;
    padding: 12px 14px 12px 42px;
    background: transparent;
    border: none;
    outline: none;
    font-size: 14px;
    color: #1e3d2f;
    font-family: inherit;
    box-sizing: border-box;
}

.input-container input::placeholder {
    color: #95a59d;
}

/* Remember Me & Forgot Password Row */
.remember-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    margin: 10px 0 22px;
    color: #40634f;
}

.remember-me {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
}

.remember-me input[type="checkbox"] {
    accent-color: #2d6a4f;
    width: 16px;
    height: 16px;
    cursor: pointer;
    margin: 0;
}

.forgot-link {
    color: #2d6a4f;
    font-weight: 600;
    text-decoration: none;
    transition: color 0.2s ease;
}

.forgot-link:hover {
    color: #1b4332;
    text-decoration: underline;
}

/* Submit Button */
.submit-btn {
    width: 100%;
    padding: 13px 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 6px 18px rgba(45, 106, 79, 0.22);
    transition: all 0.25s ease;
}

.submit-btn:hover {
    background: linear-gradient(135deg, #357a5b 0%, #204e3b 100%);
    box-shadow: 0 8px 22px rgba(45, 106, 79, 0.32);
    transform: translateY(-2px);
}

.submit-btn:active {
    transform: translateY(0);
    box-shadow: 0 4px 12px rgba(45, 106, 79, 0.18);
}

/* Signup Footer */
.signup {
    margin-top: 24px;
    font-size: 13.5px;
    color: #55705c;
    text-align: center;
}

.signup a {
    color: #2d6a4f;
    font-weight: 700;
    text-decoration: none;
    margin-left: 4px;
    transition: color 0.2s ease;
}

.signup a:hover {
    color: #1b4332;
    text-decoration: underline;
}
</style>
{% endblock %}
