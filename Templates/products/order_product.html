{% extends 'base.html' %}

{% block content %}

<div class="container">

    <h3>Add Product</h3>

    <form method="post">
        {% csrf_token %}

        <label>Quantity:</label>
        <input type="number" step="0.1" name="quantity" class="form-control" required>

        <br>

        <button type="submit" class="btn btn-primary">
            Add to Order
        </button>

    </form>

</div>

{% endblock %}
