{% extends "base.html" %}
{% load static %}

{% block extra_css %}

<link rel="stylesheet" href="{% static 'css/finance.css' %}">

{% endblock %}

{% block title %}
Receive Payment
{% endblock %}


{% block content %}

<div class="container-fluid mt-4">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-success text-white">
            <h4 class="mb-0">
                Receive Payment
            </h4>
        </div>


        <div class="card-body">


            <div class="row mb-4">

                <div class="col-md-6">

                    <label class="font-weight-bold">
                        Journal ID
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ journal.journal_id }}"
                        readonly
                    >

                </div>


                <div class="col-md-6">

                    <label class="font-weight-bold">
                        Customer
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ journal.customer.username|default:'N/A' }}"
                        readonly
                    >

                </div>

            </div>



            <div class="row mb-4">


                <div class="col-md-6">

                    <label class="font-weight-bold">
                        Total Amount
                    </label>


                    <input
                        type="text"
                        class="form-control"
                        value="{{ journal.grand_total }}"
                        readonly
                    >

                </div>


                <div class="col-md-6">

                    <label class="font-weight-bold">
                        Voucher No
                    </label>


                    <input
                        type="text"
                        class="form-control"
                        value="{{ journal.voucher_no }}"
                        readonly
                    >

                </div>


            </div>




            <form method="POST">


                {% csrf_token %}



                <div class="form-group">

                    <label>
                        Receive Amount
                    </label>


                    <input
                        type="number"
                        step="0.01"
                        name="amount"
                        class="form-control"
                        placeholder="Enter payment amount"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>
                        Remarks
                    </label>


                    <textarea
                        name="remarks"
                        class="form-control"
                        rows="3"
                        placeholder="Payment remarks..."
                    ></textarea>


                </div>




                <div class="mt-3">


                    <button
                        type="submit"
                        class="btn btn-success"
                    >

                        <i class="fas fa-money-bill-wave"></i>
                        Receive Payment

                    </button>



                    <a
                        href="{% url 'journal_detail' journal.journal_id %}"
                        class="btn btn-secondary"
                    >

                        Cancel

                    </a>


                </div>



            </form>


        </div>

    </div>


</div>


{% endblock %}
